<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="info-width" content="1920"><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css'); @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap');
* { box-sizing:border-box; margin:0; }

.ch small { font-size:12.5px; font-weight:700; opacity:.75; } .ch b { font-size:16px; font-weight:900; letter-spacing:-.02em; } .ch s { text-decoration:none; font-weight:700; opacity:.55; font-size:.84em; } .ch i { font-style:normal; margin:0 4px; opacity:.6; font-weight:700; }

html { background:#141a2b; }

.lg { display:flex; gap:10px; margin:2px 0 14px; } .lg span { padding:4px 12px; border-radius:999px; font-size:14px; font-weight:900; color:#fff; }
